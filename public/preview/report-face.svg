<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E8"/>
      <stop offset="55%" stop-color="#EDE6F4"/>
      <stop offset="100%" stop-color="#D9D0EB"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.35" y1="0.1" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#E8C3A4"/>
      <stop offset="50%" stop-color="#D9A57F"/>
      <stop offset="100%" stop-color="#C48B68"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1A12"/>
      <stop offset="100%" stop-color="#4A2C1C"/>
    </linearGradient>
    <radialGradient id="blushL" cx="32%" cy="52%" r="12%">
      <stop offset="0%" stop-color="#E08A7A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E08A7A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blushR" cx="68%" cy="51%" r="12%">
      <stop offset="0%" stop-color="#E08A7A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E08A7A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <!-- shoulders -->
  <ellipse cx="300" cy="760" rx="210" ry="90" fill="#C9B8A8"/>
  <path d="M90 800 C90 680 180 620 300 620 C420 620 510 680 510 800 Z" fill="#8A6B8E"/>
  <!-- neck -->
  <path d="M250 470 C255 560 270 610 300 630 C330 610 345 560 350 470 Z" fill="url(#skin)"/>
  <!-- hair back -->
  <path d="M140 280 C130 140 210 70 300 62 C400 54 490 140 470 290 C490 420 470 560 430 640 C400 560 390 430 380 360 C360 470 240 480 210 360 C190 450 170 560 155 640 C120 540 145 400 140 280 Z" fill="url(#hair)"/>
  <!-- face -->
  <ellipse cx="300" cy="355" rx="128" ry="168" fill="url(#skin)"/>
  <ellipse cx="300" cy="355" rx="128" ry="168" fill="url(#blushL)"/>
  <ellipse cx="300" cy="355" rx="128" ry="168" fill="url(#blushR)"/>
  <!-- hair front -->
  <path d="M178 250 C190 120 250 88 300 86 C360 84 430 130 428 250 C418 175 370 125 300 128 C235 130 188 180 178 250 Z" fill="url(#hair)"/>
  <path d="M175 250 C168 310 172 380 188 430 C175 360 178 290 190 240 C185 210 200 175 230 155 C200 190 180 220 175 250 Z" fill="url(#hair)"/>
  <path d="M425 248 C432 310 428 380 412 430 C425 360 422 290 410 240 C415 210 400 175 370 155 C400 190 420 220 425 248 Z" fill="url(#hair)"/>
  <!-- brows -->
  <path d="M232 318 C250 308 272 308 288 316" stroke="#3A2418" stroke-width="6" stroke-linecap="round"/>
  <path d="M312 316 C328 308 350 308 368 318" stroke="#3A2418" stroke-width="6" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="255" cy="342" rx="18" ry="12" fill="#FBF6F0"/>
  <ellipse cx="345" cy="342" rx="18" ry="12" fill="#FBF6F0"/>
  <ellipse cx="257" cy="343" rx="9" ry="10" fill="#3D2918"/>
  <ellipse cx="347" cy="343" rx="9" ry="10" fill="#3D2918"/>
  <circle cx="260" cy="340" r="3" fill="#FBF6F0"/>
  <circle cx="350" cy="340" r="3" fill="#FBF6F0"/>
  <!-- nose -->
  <path d="M300 348 C296 372 292 388 300 400 C308 388 304 372 300 348" stroke="#B67A5A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- lips -->
  <path d="M270 430 C288 422 312 422 330 430 C312 444 288 444 270 430 Z" fill="#C56B68"/>
  <path d="M274 430 C288 426 312 426 326 430" stroke="#E8A8A0" stroke-width="2" stroke-linecap="round"/>
</svg>
