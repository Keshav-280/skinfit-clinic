AWSTemplateFormatVersion: '2010-09-09'
Description: 'Skinfit Clinic: Production Network and Core Infrastructure (VPC, Security Groups, ECR, RDS, ElastiCache, Bastion)'

Parameters:
  DBPassword:
    Type: String
    Description: Master password for the RDS PostgreSQL database (minimum 8 characters)
    MinLength: 8
    NoEcho: true
    Default: "skinfit_prod_db_pass"

  BastionKeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: skinfit-key
    Description: EC2 key pair for SSH (create in EC2 → Key Pairs before stack update)

  BastionAllowedIp:
    Type: String
    Description: Your public IPv4 from whatismyip.com — only this IP may SSH to the bastion
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'
    ConstraintDescription: Must be a valid IPv4 address, e.g. 123.45.67.89

  BastionAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  # =========================================================================
  # 1. NETWORKING (VPC, Subnets, Gateways)
  # =========================================================================
  
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: skinfit-vpc
        - Key: Project
          Value: SkinfitClinic

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: skinfit-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets (For ALB and NAT Gateway)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [ 0, !GetAZs "" ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: skinfit-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [ 1, !GetAZs "" ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: skinfit-public-2

  # Private Subnets (For Next.js containers, Redis, and ML workers)
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [ 0, !GetAZs "" ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: skinfit-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.20.0/24
      AvailabilityZone: !Select [ 1, !GetAZs "" ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: skinfit-private-2

  # NAT Gateway for egress traffic from private subnets
  NatElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: skinfit-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatElasticIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: skinfit-nat-gateway

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: skinfit-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: skinfit-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # Subnet Associations
  PublicSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # =========================================================================
  # 2. SECURITY GROUPS
  # =========================================================================

  # Load Balancer Security Group (Allows web traffic from anywhere)
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP/HTTPS traffic to Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: skinfit-alb-sg

  # Next.js Container Security Group (Allows traffic only from ALB)
  NextJSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic to Next.js containers only from ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: skinfit-nextjs-sg

  # ML Worker Security Group (Uses default egress only; no ingress needed since it pulls from Redis)
  MLWorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for background ML workers (Egress only)
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: skinfit-ml-worker-sg

  # ML Inference Security Group (Allows traffic only from NextJS and ML Worker)
  MLInferenceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic to ML Inference container from web and background workers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8765
          ToPort: 8765
          SourceSecurityGroupId: !Ref NextJSSecurityGroup
        - IpProtocol: tcp
          FromPort: 8765
          ToPort: 8765
          SourceSecurityGroupId: !Ref MLWorkerSecurityGroup
      Tags:
        - Key: Name
          Value: skinfit-ml-inference-sg

  # Redis Security Group (Allows traffic only from NextJS and ML Worker)
  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic to Redis only from Next.js and ML Workers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref NextJSSecurityGroup
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref MLWorkerSecurityGroup
      Tags:
        - Key: Name
          Value: skinfit-redis-sg

  # RDS PostgreSQL Security Group (Next.js, ML Worker, and Bastion for migrations)
  PostgresSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL from app containers and bastion only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref NextJSSecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref MLWorkerSecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BastionSecurityGroup
      Tags:
        - Key: Name
          Value: skinfit-postgres-sg

  # Bastion — SSH from your IP only; used to tunnel to private RDS
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bastion SSH from operator IP only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${BastionAllowedIp}/32"
      Tags:
        - Key: Name
          Value: skinfit-bastion-sg

  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref BastionAmi
      InstanceType: t4g.micro
      KeyName: !Ref BastionKeyName
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      Tags:
        - Key: Name
          Value: skinfit-bastion
        - Key: Project
          Value: SkinfitClinic

  # =========================================================================
  # 3. CONTAINER REGISTRIES (ECR)
  # =========================================================================

  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: skinfit-web
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: Project
          Value: SkinfitClinic

  MLWorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: skinfit-ml-worker
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: Project
          Value: SkinfitClinic

  MLInferenceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: skinfit-ml-inference
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: Project
          Value: SkinfitClinic

  # Database Subnet Group (Required for RDS to span multiple AZs in our private subnets)
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS Postgres
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: skinfit-db-subnet-group

  # RDS PostgreSQL Database Instance (db.t4g.micro class, isolated in private subnets)
  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: skinfit
      DBInstanceIdentifier: skinfit-db
      AllocatedStorage: '20'
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      EngineVersion: '16'
      MasterUsername: skinfit
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref PostgresSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      StorageType: gp3
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: skinfit-db-instance

  # ElastiCache Redis 7 — BullMQ job queue (private subnets, app SGs only)
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Private subnets for ElastiCache Redis
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      CacheSubnetGroupName: skinfit-redis-subnets

  # BullMQ: volatile-lru evicts queue keys under memory pressure — use noeviction.
  RedisParameterGroup:
    Type: AWS::ElastiCache::ParameterGroup
    Properties:
      CacheParameterGroupFamily: redis7
      Description: Skinfit Redis — noeviction for BullMQ job queues
      Properties:
        maxmemory-policy: noeviction

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: skinfit-redis
      Engine: redis
      EngineVersion: '7.1'
      CacheNodeType: cache.t4g.micro
      NumCacheNodes: 1
      CacheParameterGroupName: !Ref RedisParameterGroup
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup
      Tags:
        - Key: Name
          Value: skinfit-redis
        - Key: Project
          Value: SkinfitClinic

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VPCID"
  PublicSubnet1:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1
  PublicSubnet2:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
  PrivateSubnet1:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
  PrivateSubnet2:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
  ALBSecurityGroup:
    Description: ALB Security Group ID
    Value: !Ref ALBSecurityGroup
  NextJSSecurityGroup:
    Description: Next.js Security Group ID
    Value: !Ref NextJSSecurityGroup
  PostgresSecurityGroup:
    Description: Postgres Security Group ID
    Value: !Ref PostgresSecurityGroup
  RedisSecurityGroup:
    Description: Redis Security Group ID
    Value: !Ref RedisSecurityGroup
  MLWorkerSecurityGroup:
    Description: ML Worker Security Group ID
    Value: !Ref MLWorkerSecurityGroup
  MLInferenceSecurityGroup:
    Description: ML Inference Security Group ID
    Value: !Ref MLInferenceSecurityGroup
  RDSEndpoint:
    Description: RDS Database Endpoint Address
    Value: !GetAtt RDSInstance.Endpoint.Address
  RedisEndpoint:
    Description: ElastiCache Redis primary endpoint hostname
    Value: !GetAtt RedisCluster.RedisEndpoint.Address
  RedisPort:
    Description: ElastiCache Redis port
    Value: !GetAtt RedisCluster.RedisEndpoint.Port
  ElastiCacheUrl:
    Description: Set as ELASTICACHE_URL on ECS (redis://host:port)
    Value: !Sub "redis://${RedisCluster.RedisEndpoint.Address}:${RedisCluster.RedisEndpoint.Port}"
  BastionPublicIp:
    Description: Bastion host public IP for SSH tunnel
    Value: !GetAtt BastionHost.PublicIp
  BastionSecurityGroup:
    Description: Bastion Security Group ID
    Value: !Ref BastionSecurityGroup
