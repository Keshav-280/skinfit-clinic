name: Deploy ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: "417326870953"
      ECR_REGISTRY: 417326870953.dkr.ecr.ap-south-1.amazonaws.com
      ECS_CLUSTER: skinfit-cluster
      ECS_WEB_SERVICE: skinfit-web
      ECS_WORKER_SERVICE: skinfit-ml-worker-service-o26zxlzb
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/skinfit-web:latest
            ${{ env.ECR_REGISTRY }}/skinfit-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ml-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ml-worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/skinfit-ml-worker:latest
            ${{ env.ECR_REGISTRY }}/skinfit-ml-worker:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Force deploy web
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WEB_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Force deploy ml-worker
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WEB_SERVICE" "$ECS_WORKER_SERVICE" \
            --region "$AWS_REGION"
