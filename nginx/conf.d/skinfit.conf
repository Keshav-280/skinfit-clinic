# Skinfit — reverse proxy to Next.js (Docker service `web`, port 3000)
# Supports multiple web containers: docker compose ... up -d --scale web=2
# (uses Docker DNS 127.0.0.11 so each request can hit a different replica)
# TLS: Cloudflare (port 80) or certbot + skinfit-ssl.conf

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Face scan uploads (multipart / presigned flows)
  client_max_body_size 64m;

  access_log /var/log/nginx/skinfit.access.log;
  error_log /var/log/nginx/skinfit.error.log warn;

  # Docker embedded DNS (required for --scale web=N)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # AcneDet grading UI + API (containerized acne-detector service on :8000)
  location = /acne-detector-v1 {
    return 301 /acne-detector-v1/;
  }

  location /acne-detector-v1/ {
    set $acne_upstream acne-detector:8000;
    proxy_pass http://$acne_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 25m;
  }

  # Chat SSE — disable buffering so mobile/web streams get live chunks
  location ~ ^/api/chat/plain/(inbox-stream|stream) {
    set $skinfit_upstream web:3000;
    proxy_pass http://$skinfit_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    set $skinfit_upstream web:3000;
    proxy_pass http://$skinfit_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
