# Production overlay — use with base compose from repo root:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --build
#
# Adds nginx on :80 (and :443 if you enable SSL mounts). Prefer closing public :3000 in the EC2 security group.

services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  web:
    restart: unless-stopped
    # Hard cap so a memory spike kills+restarts ONLY this container instead of
    # OOM-freezing the whole VM (which took SSH/ping down twice). Keep the Node
    # heap comfortably under the cgroup limit to leave room for non-heap memory.
    mem_limit: 5g
    mem_reservation: 2g
    environment:
      # Annotator state JSON can be large; default Node heap (~2GB) OOMs under concurrent load.
      NODE_OPTIONS: "--max-old-space-size=3072"
    # !reset clears base compose `ports: 3000:3000` (empty [] alone does not)
    ports: !reset []
    expose:
      - "3000"

  ml-inference:
    restart: unless-stopped
    ports: !reset []
    # One replica on the prod VM — ML loads large models; never scale this service.
    container_name: skinfit-ml-inference

  ml-worker:
    restart: unless-stopped
    # One replica — scan jobs run sequentially (worker concurrency is already 1).
    container_name: skinfit-ml-worker

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      # Host certs from certbot (required when skinfit-ssl.conf is enabled)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    # Optional: run 2+ app replicas — nginx load-balances via Docker DNS (see nginx/README.md)
    # Start with: docker compose ... up -d --scale web=2
    healthcheck:
      # Requires port-80 /healthz without HTTPS redirect (skinfit-ssl.conf).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz 2>/dev/null | grep -q '^ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
